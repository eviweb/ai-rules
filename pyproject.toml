[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-rules"
dynamic = ["version"]
description = "Manage shared rules and configuration for AI coding assistants"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0,<1.0.0",
]

[project.scripts]
ai-rules = "ai_rules.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
]

[tool.hatch.version]
path = "src/ai_rules/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
